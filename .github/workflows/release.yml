name: Release

# Push a tag like v1.2.0 -> validate -> zip every skill -> create a GitHub Release with the zips attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python3 scripts/validate_skills.py
      - name: Package
        run: bash scripts/package_skills.sh
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          ## Cài đặt / Install

          **claude.ai / Claude Desktop:** tải file `.zip` của từng skill bên dưới (không giải nén) → Customize → Skills → **+** → Create skill → Upload a skill.

          **Claude Code:**
          ```
          /plugin marketplace add trinhcongkhanh/skills-claude
          /plugin install khanh-toolkit@khanh-skills
          ```

          `all-skills.zip` chứa tất cả skill để copy thủ công vào `~/.claude/skills/` (không dùng để upload lên claude.ai).

          Chi tiết: [docs/INSTALL.md](https://github.com/trinhcongkhanh/skills-claude/blob/main/docs/INSTALL.md) · Thay đổi: [CHANGELOG.md](https://github.com/trinhcongkhanh/skills-claude/blob/main/CHANGELOG.md)
          EOF
          gh release create "$TAG" dist/*.zip --title "skills-claude $TAG" --notes-file notes.md
